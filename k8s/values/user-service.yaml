stages:
  - test
  - build
  - deploy


.deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    - >
      helm upgrade --install $SERVICE k8s/charts/service
      -f k8s/values/$SERVICE.yaml
      -n $K8S_NAMESPACE --create-namespace
      --set image.repository=$CI_REGISTRY_IMAGE/$SERVICE
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --atomic --wait --timeout 3m

deploy:frontend:staging:
  extends: .deploy
  variables:
    SERVICE: frontend
    K8S_NAMESPACE: sy-staging
  environment:
    name: staging/frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/**/*, k8s/**/*, .gitlab-ci.yml]

deploy:frontend:production:
  extends: .deploy
  variables:
    SERVICE: frontend
    K8S_NAMESPACE: sy-production
  environment:
    name: production/frontend
  needs: ["deploy:frontend:staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/**/*, k8s/**/*, .gitlab-ci.yml]
      when: manual