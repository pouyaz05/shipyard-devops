apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: sy
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: sy
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: fix-perms
              image: postgres:16
              command: ["sh", "-c", "chown 999:999 /backups"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - {name: backups, mountPath: /backups}
          containers:
            - name: dump
              image: postgres:16
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  f=/backups/all-$(date +%F-%H%M).sql.gz
                  pg_dumpall -h postgres -U "$PGUSER" | gzip > "$f"
                  gzip -t "$f"
                  find /backups -name 'all-*.sql.gz' -mtime +7 -delete
                  ls -lh /backups
              env:
                - name: PGUSER
                  value: shipyard
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              securityContext:
                runAsUser: 999
                runAsNonRoot: true
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups