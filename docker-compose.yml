name: shipyard

# Local stack for development and demos. Kubernetes/Helm lives in k8s/.
# Usage: make up && make seed   (see README)

x-pip-args: &pip-args
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-60}

x-backend-health: &backend-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

# Each service gets exactly the env vars its config.py requires.
# Migrations get the same env as the app, so they never depend on what env.py imports.
x-user-env: &user-env
  DATABASE_URL: postgresql+psycopg://shipyard:${POSTGRES_PASSWORD:?run 'make env'}@postgres:5432/users_db
  JWT_SECRET: ${JWT_SECRET:?run 'make env'}

x-product-env: &product-env
  DATABASE_URL: postgresql+psycopg://shipyard:${POSTGRES_PASSWORD:?run 'make env'}@postgres:5432/products_db
  ADMIN_API_KEY: ${ADMIN_API_KEY:?run 'make env'}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run 'make env'}

x-cart-env: &cart-env
  DATABASE_URL: postgresql+psycopg://shipyard:${POSTGRES_PASSWORD:?run 'make env'}@postgres:5432/cart_db
  JWT_SECRET: ${JWT_SECRET:?run 'make env'}
  PRODUCT_SERVICE_URL: http://product-service:8000

x-order-env: &order-env
  DATABASE_URL: postgresql+psycopg://shipyard:${POSTGRES_PASSWORD:?run 'make env'}@postgres:5432/orders_db
  JWT_SECRET: ${JWT_SECRET:?run 'make env'}
  CART_SERVICE_URL: http://cart-service:8000
  PRODUCT_SERVICE_URL: http://product-service:8000
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run 'make env'}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run 'make env'}
      POSTGRES_DB: shipyard
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on the first start of an empty volume (use `make clean` to reset).
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- user-service ----------
  user-service-migrate:
    build: &user-build
      context: ./services/user-service
      args: *pip-args
    command: ["alembic", "upgrade", "head"]
    environment: *user-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-service:
    build: *user-build
    environment: *user-env
    depends_on:
      postgres:
        condition: service_healthy
      user-service-migrate:
        condition: service_completed_successfully
    healthcheck: *backend-health
    restart: unless-stopped

  # ---------- product-service ----------
  product-service-migrate:
    build: &product-build
      context: ./services/product-service
      args: *pip-args
    command: ["alembic", "upgrade", "head"]
    environment: *product-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  product-service:
    build: *product-build
    environment: *product-env
    depends_on:
      postgres:
        condition: service_healthy
      product-service-migrate:
        condition: service_completed_successfully
    healthcheck: *backend-health
    restart: unless-stopped

  # ---------- cart-service ----------
  cart-service-migrate:
    build: &cart-build
      context: ./services/cart-service
      args: *pip-args
    command: ["alembic", "upgrade", "head"]
    environment: *cart-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cart-service:
    build: *cart-build
    environment: *cart-env
    depends_on:
      postgres:
        condition: service_healthy
      cart-service-migrate:
        condition: service_completed_successfully
    healthcheck: *backend-health
    restart: unless-stopped

  # ---------- order-service ----------
  order-service-migrate:
    build: &order-build
      context: ./services/order-service
      args: *pip-args
    command: ["alembic", "upgrade", "head"]
    environment: *order-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  order-service:
    build: *order-build
    environment: *order-env
    depends_on:
      postgres:
        condition: service_healthy
      order-service-migrate:
        condition: service_completed_successfully
    healthcheck: *backend-health
    restart: unless-stopped

  # ---------- frontend + gateway ----------
  frontend:
    build:
      context: ./frontend
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped

  # Plays the role of the Kubernetes Ingress: one entry point, path-based routing.
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine-slim
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
