    - cd services/cart-service
    - >
      docker build
      --build-arg PIP_INDEX_URL=$PIP_INDEX_URL
      --build-arg PIP_DEFAULT_TIMEOUT=$PIP_DEFAULT_TIMEOUT
      -t $IMAGE .
    - docker run --rm $IMAGE python -c "import fastapi, sqlalchemy, psycopg, jwt, httpx"
