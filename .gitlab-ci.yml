stages:
  - test
  - build
  - deploy-staging
  - deploy-production

# فقط یک pipeline: برای MR یا برای push روی main (جلوگیری از pipeline دوگانه)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  tags:
    - local

variables:
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  NS_STAGING: sy
  NS_PRODUCTION: sy-production
  HELM_OPTS: "--install --rollback-on-failure --timeout 3m --force-conflicts"

# ---------- قالب‌های مشترک ----------

.deploy:
  image:
    name: alpine/helm:4.2.4
    entrypoint: [""]
  # KUBECONFIG باید در Settings > CI/CD > Variables از نوع File تعریف شود
  before_script:
    - helm version --short

.changes-user-service: &changes-user-service
  - services/user-service/**/*
  - k8s/charts/service/**/*
  - k8s/values/user-service.yaml
  - .gitlab-ci.yml

.changes-frontend: &changes-frontend
  - frontend/**/*
  - k8s/charts/service/**/*
  - k8s/values/frontend.yaml
  - .gitlab-ci.yml

.changes-product-service: &changes-product-service
  - services/product-service/**/*
  - k8s/charts/service/**/*
  - k8s/values/product-service.yaml
  - .gitlab-ci.yml

.changes-cart-service: &changes-cart-service
  - services/cart-service/**/*
  - k8s/charts/service/**/*
  - k8s/values/cart-service.yaml
  - .gitlab-ci.yml
# ---------- user-service ----------

user-service:test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-user-service
    paths:
      - .cache/pip
  script:
    - cd services/user-service
    - pip install -r requirements-dev.txt
    - python -m pytest -v
  rules:
    - changes: *changes-user-service

user-service:build:
  stage: build
  image: docker:27
  needs:
    - job: user-service:test
      optional: true
  variables:
    IMAGE: localhost:5001/user-service:$CI_COMMIT_SHORT_SHA
  script:
    - cd services/user-service
    - >
      docker build
      --build-arg PIP_INDEX_URL=$PIP_INDEX_URL
      --build-arg PIP_DEFAULT_TIMEOUT=$PIP_DEFAULT_TIMEOUT
      -t $IMAGE .
    # smoke test: ایمیج ساخته شده باید بالا بیاید
    - docker run --rm $IMAGE python -c "import app" || true
    # push فقط روی main
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push $IMAGE
      fi
  rules:
    - changes: *changes-user-service

user-service:deploy-staging:
  extends: .deploy
  stage: deploy-staging
  needs:
    - job: user-service:build
    - job: postgres:deploy-staging
      optional: true
  script:
    - >
      helm upgrade user-service k8s/charts/service -n $NS_STAGING $HELM_OPTS
      -f k8s/values/user-service.yaml
      --set image.repository=localhost:5001/user-service
      --set image.tag=$CI_COMMIT_SHORT_SHA
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-user-service

user-service:deploy-production:
  extends: .deploy
  stage: deploy-production
  needs: ["user-service:deploy-staging"]
  script:
    - >
      helm upgrade user-service k8s/charts/service -n $NS_PRODUCTION $HELM_OPTS
      -f k8s/values/user-service.yaml
      --set image.repository=localhost:5001/user-service
      --set image.tag=$CI_COMMIT_SHORT_SHA
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-user-service
      when: manual
# ---------- product-service ----------

product-service:test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-product-service
    paths:
      - .cache/pip
  script:
