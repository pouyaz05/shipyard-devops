  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-cart-service
      when: manual
# ---------- frontend ----------

frontend:test:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
  script:
    - cd frontend
    - npm ci
    - npm test
  rules:
    - changes: *changes-frontend

frontend:build:
  stage: build
  image: docker:27
  needs:
    - job: frontend:test
      optional: true
  variables:
    IMAGE: localhost:5001/frontend:$CI_COMMIT_SHORT_SHA
  script:
    - cd frontend
    - docker build -t $IMAGE .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push $IMAGE
      fi
  rules:
    - changes: *changes-frontend

frontend:deploy-staging:
  extends: .deploy
  stage: deploy-staging
  needs: ["frontend:build"]
  script:
    - >
      helm upgrade frontend k8s/charts/service -n $NS_STAGING $HELM_OPTS
      -f k8s/values/frontend.yaml
      --set image.repository=localhost:5001/frontend
      --set image.tag=$CI_COMMIT_SHORT_SHA
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-frontend

frontend:deploy-production:
  extends: .deploy
  stage: deploy-production
  needs: ["frontend:deploy-staging"]
  script:
    - >
      helm upgrade frontend k8s/charts/service -n $NS_PRODUCTION $HELM_OPTS
      -f k8s/values/frontend.yaml
      --set image.repository=localhost:5001/frontend
      --set image.tag=$CI_COMMIT_SHORT_SHA
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *changes-frontend
      when: manual

# ---------- helm / infra ----------

helm:lint:
  stage: test
  image:
    name: alpine/helm:4.2.4
    entrypoint: [""]
  script:
    - helm lint k8s/charts/service -f k8s/values/user-service.yaml
    - helm lint k8s/charts/service -f k8s/values/frontend.yaml
    - helm lint k8s/infra/postgres
    - helm template user-service k8s/charts/service -f k8s/values/user-service.yaml > /dev/null
    - helm template frontend k8s/charts/service -f k8s/values/frontend.yaml > /dev/null
    - helm lint k8s/charts/service -f k8s/values/cart-service.yaml
    - helm template cart-service k8s/charts/service -f k8s/values/cart-service.yaml > /dev/null
    - helm template postgres k8s/infra/postgres > /dev/null
    - helm lint k8s/charts/service -f k8s/values/product-service.yaml
    - helm template product-service k8s/charts/service -f k8s/values/product-service.yaml > /dev/null
  rules:
    - changes:
        - k8s/**/*
        - .gitlab-ci.yml

postgres:deploy-staging:
  extends: .deploy
  stage: deploy-staging
  script:
    - helm upgrade postgres k8s/infra/postgres -n $NS_STAGING $HELM_OPTS
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - k8s/infra/postgres/**/*

postgres:deploy-production:
  extends: .deploy
  stage: deploy-production
  needs: ["postgres:deploy-staging"]
  script:
    - helm upgrade postgres k8s/infra/postgres -n $NS_PRODUCTION $HELM_OPTS
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - k8s/infra/postgres/**/*
      when: manual