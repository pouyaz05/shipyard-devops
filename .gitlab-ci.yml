stages:
- test
- build

default:
  tags:
  - local

variables:
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-user-service
  paths:
    - .cache/pip
user-service:test:
  stage: test
  image: python:3.12-slim
  script:
  - cd services/user-service
  - pip install -r requirements-dev.txt
  - python -m pytest -v
  rules:
  - changes:
    - services/user-service/**/*
    - .gitlab-ci.yml

user-service:build:
  stage: build
  image: docker:27
  script:
  - cd services/user-service
  - >
    docker build --build-arg PIP_INDEX_URL=$PIP_INDEX_URL --build-arg PIP_DEFAULT_TIMEOUT=$PIP_DEFAULT_TIMEOUT -t user-service:$CI_COMMIT_SHORT_SHA .
  rules:
  - changes:
    - services/user-service/**/*
    - .gitlab-ci.yml
