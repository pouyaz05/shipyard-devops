server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Internal service-to-service endpoints are never exposed (same as the Kubernetes Ingress).
    location /internal {
        return 404;
    }

    location /api/user-service/    { proxy_pass http://user-service:8000; }
    location /api/product-service/ { proxy_pass http://product-service:8000; }
    location /api/cart-service/    { proxy_pass http://cart-service:8000; }
    location /api/order-service/   { proxy_pass http://order-service:8000; }

    location / {
        proxy_pass http://frontend:8080;
    }
}
